<!DOCTYPE html>
<html>
<head>
    <title>Health Metrics Dashboard</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f7f6; }
        .chart-container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 1000px; margin: auto; }
        h2 { text-align: center; color: #333; }
    </style>
</head>
<body>

<div class="chart-container">
    <h2>Daily Health Metrics</h2>
    <canvas id="healthChart"></canvas>
</div>

<script>
async function initDashboard() {
    // Replace with your RAW GitHub JSON URL
    const url = 'YOUR_RAW_JSON_URL_HERE'; 
    
    try {
        const response = await fetch(url);
        const rawData = await response.json();

        // 1. Process and Map Data
        const labels = rawData.map(entry => entry.date); // X-Axis
        const waterData = rawData.map(entry => entry.water_intake); 
        const moodData = rawData.map(entry => entry.mood_score);
        const sugarData = rawData.map(entry => entry.blood_sugar);
        const carbData = rawData.map(entry => entry.carbs);

        const ctx = document.getElementById('healthChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    { label: 'Water (oz)', data: waterData, borderColor: '#3498db', yAxisID: 'y' },
                    { label: 'Mood (1-10)', data: moodData, borderColor: '#f1c40f', yAxisID: 'y1' },
                    { label: 'Blood Sugar', data: sugarData, borderColor: '#e74c3c', yAxisID: 'y' },
                    { label: 'Carbs (g)', data: carbData, borderColor: '#2ecc71', yAxisID: 'y' }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    y: { type: 'linear', display: true, position: 'left', title: { display: true, text: 'Values' } },
                    y1: { type: 'linear', display: true, position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: 'Mood Scale' } }
                }
            }
        });
    } catch (err) {
        console.error("Dashboard Error:", err);
    }
}

initDashboard();
</script>
</body>
</html>
