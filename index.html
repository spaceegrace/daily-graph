<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stats Visualizer</title>
    <!-- Using the CDN so you don't get the "Can't find variable" error -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: system-ui, sans-serif; background: #f1f5f9; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 1000px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 150px; border: 1px solid #cbd5e1; border-radius: 8px; padding: 12px; margin-bottom: 10px; box-sizing: border-box; font-family: monospace; font-size: 12px; }
        button { background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
        #status { margin-top: 10px; font-weight: bold; }
        .chart-box { margin-top: 20px; height: 500px; width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <h1>Stats Visualizer</h1>
    <textarea id="jsonInput" placeholder="Paste data here..."></textarea>
    <button onclick="visualize()">Generate Graph</button>
    <div id="status" style="color: #64748b;">Ready</div>
    <div class="chart-box"><canvas id="healthChart"></canvas></div>
</div>

<script>
let chartInstance = null;
const moodScores = { "Focused": 10, "Calm": 8, "Neutral": 5, "Confused": 4, "Tired": 3, "Grumpy": 1 };

function parseTime(str) {
    if (!str || !str.includes('@')) return "00:00";
    return str.split('@').pop().trim();
}

function visualize() {
    const rawInput = document.getElementById('jsonInput').value;
    const status = document.getElementById('status');
    const ctx = document.getElementById('healthChart').getContext('2d');

    try {
        const cleanInput = rawInput.replace(/[\u200B-\u200D\uFEFF]/g, '').trim();
        const data = JSON.parse(cleanInput);
        
        status.innerText = "Analyzing data...";
        status.style.color = "blue";

        const allLogs = [...(data.sugarLog || []), ...(data.moodLog || [])].sort((a,b) => a.id - b.id);
        const labels = [...new Set(allLogs.map(i => parseTime(i.fullDate)))];

        const datasets = [];

        if (data.sugarLog && data.sugarLog.length > 0) {
            datasets.push({
                label: 'Blood Sugar',
                data: data.sugarLog.map(s => ({ x: parseTime(s.fullDate), y: s.val })),
                borderColor: '#ef4444', backgroundColor: '#ef4444', tension: 0.3
            });
        }

        const moods = (data.moodLog || []).filter(m => m.type === 'mood');
        if (moods.length > 0) {
            datasets.push({
                label: 'Mood (1-10)',
                data: moods.map(m => ({ x: parseTime(m.fullDate), y: moodScores[m.val] || 5 })),
                borderColor: '#f59e0b', backgroundColor: '#f59e0b', yAxisID: 'yMood', tension: 0.3
            });
        }

        let wCount = 0;
        const water = (data.moodLog || []).filter(m => m.type === 'water');
        if (water.length > 0) {
            datasets.push({
                label: 'Water',
                data: water.map(w => ({ x: parseTime(w.fullDate), y: ++wCount })),
                borderColor: '#3b82f6', backgroundColor: '#3b82f6', stepped: true
            });
        }

        if (chartInstance) chartInstance.destroy();

        chartInstance = new Chart(ctx, {
            type: 'line',
            data: { datasets: datasets },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { type: 'category', labels: labels },
                    yMood: { position: 'right', min: 0, max: 10, grid: { drawOnChartArea: false } }
                }
            }
        });

        status.innerText = "Graph Generated Successfully!";
        status.style.color = "green";

    } catch (err) {
        status.innerText = "Error: " + err.message;
        status.style.color = "red";
    }
}
</script>
</body>
</html>
