<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Line Graph Generator</title>
    <!-- Importing Chart.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 40px; background: #f0f2f5; color: #333; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { margin-top: 0; color: #1a73e8; }
        textarea { width: 100%; height: 180px; font-family: 'Courier New', monospace; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { margin-top: 15px; padding: 12px 24px; background: #1a73e8; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1557b0; }
        .chart-wrapper { margin-top: 40px; position: relative; height: 400px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Multi-Element Line Graph</h2>
    <p>Edit the JSON below to add more datasets or change values:</p>
    
    <textarea id="jsonInput">
{
  "labels": ["Jan", "Feb", "Mar", "Apr", "May", "Jun"],
  "datasets": [
    {
      "label": "Project Alpha",
      "data": [10, 25, 45, 30, 55, 70],
      "borderColor": "#4285F4"
    },
    {
      "label": "Project Beta",
      "data": [20, 35, 25, 60, 40, 50],
      "borderColor": "#DB4437"
    }
  ]
}
    </textarea>
    
    <button onclick="drawGraph()">Update Graph</button>

    <div class="chart-wrapper">
        <canvas id="myChart"></canvas>
    </div>
</div>

<script>
    let chartInstance = null;

    function drawGraph() {
        const textArea = document.getElementById('jsonInput');
        const ctx = document.getElementById('myChart').getContext('2d');

        try {
            const config = JSON.parse(textArea.value);

            // Destroy existing chart to prevent hover glitches
            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: config.labels,
                    datasets: config.datasets.map(ds => ({
                        ...ds,
                        borderWidth: 3,
                        pointRadius: 4,
                        tension: 0.3 // Makes the lines slightly curved
                    }))
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        } catch (err) {
            alert("Error parsing JSON: " + err.message);
        }
    }

    // Run once on load
    window.onload = drawGraph;
</script>

</body>
</html>
